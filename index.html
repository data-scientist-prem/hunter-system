<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hunter System</title>
<meta name="description" content="Workout tracker with daily quests, ranks and Google Drive backup.">
<meta name="theme-color" content="#060a14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hunter">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: the "System" of an RPG talking to a hunter: terse, glowing, rewarding.
IDEA: every workout is a daily quest shown in a holographic system window; ranks E to S.
PICTURE: today's quest window with its progress ring, then the lifts to log.
COLOUR and TYPE: deep navy night, cyan system glow, plate colours only as day markers; Rajdhani over Barlow.
LAYOUT: one column up to 760px, app bar with streak and rank, bottom nav, rest timer above it.
*/
:root{color-scheme:light dark;
--bg:light-dark(#eef3fa,#060a14);--surface:light-dark(#fff,#0b1426);--sunk:light-dark(#f1f6fd,#0f1c33);
--ink:light-dark(#0d1b2e,#e3ecff);--muted:light-dark(#4c5f7a,#8ea3c4);--line:light-dark(#c3d5ec,#1d3a64);
--sys:light-dark(#1565c0,#4fc3ff);--glow:light-dark(rgba(21,101,192,.10),rgba(79,195,255,.16));
--amber:#f59e0b;--flame:#ea580c;--xp:#059669;--red:#d23a2f;--navy:#1f3f94;--blue:#2c5fd6;--yellow:#e3a900;--green:#21915a;--grey:#7d8590;--focus:light-dark(#1565c0,#66ccff);
--disp:'Rajdhani','Arial Narrow',sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
html:root[data-mode=light]{color-scheme:light!important}html:root[data-mode=dark]{color-scheme:dark!important}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(150px + env(safe-area-inset-bottom));touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:var(--disp);line-height:1.05;margin:0;text-wrap:balance}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 0}
.tabs button{flex:none;border:0;background:none;padding:10px 14px;border-radius:10px;font-weight:600;color:var(--muted);min-height:44px}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.dateline{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding:16px 0 6px}
.dateline b{font-family:var(--disp);font-size:22px}
.sync{font-size:13px;color:var(--muted)}
.plates{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:8px 0 16px}
.plate{border:0;background:none;padding:0;display:grid;justify-items:center;gap:4px;min-height:44px}
.disc{width:min(48px,100%);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--surface) 0 17%,rgba(0,0,0,.28) 18% 22%,var(--c) 23% 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.18),0 2px 0 rgba(0,0,0,.25);display:grid;place-items:center;position:relative}
.plate small{font-size:12px;color:var(--muted);line-height:1.2;text-align:center}
.plate.sel small{color:var(--ink);font-weight:700}
.plate.sel .disc{outline:3px solid var(--ink);outline-offset:2px}
.plate .tick{position:absolute;right:-3px;top:-3px;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:12px;display:grid;place-items:center;font-weight:700}
.hero{padding:4px 16px 0}.hero>.wrap{position:relative;max-width:728px;background:linear-gradient(180deg,var(--glow),transparent 70%),var(--surface);border:1px solid color-mix(in srgb,var(--sys) 55%,transparent);border-radius:12px;padding:18px 18px 16px 22px;box-shadow:0 0 24px var(--glow),inset 0 0 0 1px var(--glow);overflow:hidden}
.hero>.wrap::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--day)}
.syslabel{display:inline-block;font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.08em;color:var(--sys);border:1px solid color-mix(in srgb,var(--sys) 50%,transparent);border-radius:6px;padding:1px 10px;margin-bottom:8px;text-shadow:0 0 8px var(--glow)}
.hero h1{font-size:clamp(38px,9vw,54px);font-weight:700;letter-spacing:.01em}
.hero p{margin:6px 0 12px;font-size:17px;max-width:60ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid color-mix(in srgb,var(--sys) 45%,transparent);border-radius:99px;padding:3px 10px;font-size:14px;font-weight:600;white-space:nowrap}
.swap{margin-top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.swap select{background:var(--sunk);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:40px;font-size:16px}
.phase{margin:16px 0 0;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:15px}
section.blk{margin-top:26px}
.blkhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.blkhead h2{font-size:28px}
.blkhead span{color:var(--muted);font-size:14px;white-space:nowrap}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.exhead{display:grid;grid-template-columns:76px minmax(0,1fr) 44px;gap:12px;align-items:center;padding:10px;width:100%;border:0;background:none;text-align:left}
.thumb{width:76px;height:57px;border-radius:8px;object-fit:cover;background:var(--sunk)}
.exname{font-weight:700;font-size:17px;line-height:1.25}
.exmeta{font-size:14px;color:var(--muted);line-height:1.35;margin-top:2px}
.chev{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;transition:transform .2s}
.ex.open .chev{transform:rotate(180deg)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);margin-top:4px;margin-right:4px}
.tag.go{background:var(--green);color:#fff;border-color:transparent}
.sets{padding:0 10px 10px;display:grid;gap:6px}
.setrow{display:grid;grid-template-columns:52px minmax(0,1fr) minmax(0,1fr) 52px;gap:8px;align-items:center}
.setrow label{font-size:13px;color:var(--muted);font-weight:600}
.setrow input{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:10px;background:var(--sunk);padding:6px 10px;font-size:18px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.setrow input::placeholder{color:var(--muted);font-weight:500;opacity:.8}
.done{width:52px;height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--sunk);display:grid;place-items:center}
.done[aria-pressed=true]{background:var(--day);border-color:transparent;color:var(--dayink)}
.setlbl{display:grid;grid-template-columns:52px minmax(0,1fr) minmax(0,1fr) 52px;gap:8px;font-size:12px;color:var(--muted);text-align:center}
.detail{display:none;border-top:1px solid var(--line);padding:12px}
.ex.open .detail{display:block}
.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
.gallery figure{flex:0 0 min(86%,340px);scroll-snap-align:start;margin:0}
.gallery img{width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:var(--sunk);display:block}
.gallery figcaption{font-size:13px;color:var(--muted);padding-top:4px}
.detail h3{font-family:Barlow,sans-serif;font-size:15px;margin:14px 0 4px}
.detail ul{margin:0;padding-left:20px}
.detail li{margin:2px 0}
.detail p{margin:4px 0}
.muscles{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.muscles span{font-size:13px;padding:2px 9px;border-radius:99px;background:var(--sunk);border:1px solid var(--line)}
.muscles span.p{background:var(--ink);color:var(--bg);border-color:transparent}
.linkbtn{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:10px;border:1.5px solid var(--line);text-decoration:none;color:var(--ink);font-weight:600;margin-top:12px}
.altbox{margin-top:10px;padding:10px;border-radius:10px;background:var(--sunk);display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;align-items:center;font-size:14px}
.altbox img{width:72px;height:54px;object-fit:cover;border-radius:6px}
.check{display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:8px;align-items:center;padding:6px 10px 6px 0}
.cbtn{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;padding:4px 10px;border:0;background:none;text-align:left;width:100%;min-height:56px}
.checkbtn{width:52px;height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--sunk);display:grid;place-items:center}
.checkbtn[aria-pressed=true]{background:var(--day);color:var(--dayink);border-color:transparent}
.check .thumb{width:64px;height:48px}
.big{display:block;width:100%;min-height:54px;border:0;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:700;font-size:18px;margin-top:22px}
.big.ghost{background:none;color:var(--ink);border:1.5px solid var(--line)}
.note{font-size:14px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
.card h2{font-size:26px;margin-bottom:6px}
.card h3{font-size:20px;margin:14px 0 4px}
.card p,.card li{max-width:68ch}
.card ul,.card ol{padding-left:20px;margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--c);vertical-align:-1px;margin-right:6px}
.field{display:grid;gap:4px;margin:8px 0}
.field input,textarea{min-height:46px;border:1.5px solid var(--line);border-radius:10px;background:var(--sunk);padding:8px 10px;font-size:16px;width:100%}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.btn{min-height:46px;border-radius:10px;border:0;background:var(--ink);color:var(--bg);font-weight:700;padding:0 16px}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--line)}
.timer{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ink);color:var(--bg);transform:translateY(110%);transition:transform .25s}
.timer.on{transform:none}
.timer .wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.tnum{font-family:var(--disp);font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.tlbl{font-size:13px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtns{display:flex;gap:6px}
.tbtns button{min-width:52px;min-height:46px;border-radius:10px;border:1.5px solid rgba(127,127,127,.5);background:none;color:inherit;font-weight:700}
.bar{height:4px;background:var(--day,var(--red));transition:width 1s linear}
.timer.end{background:var(--red);color:#fff}
.restday{padding:18px 0}
.empty{padding:20px;text-align:center;color:var(--muted)}
.scroll{overflow-x:auto}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:7.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7em;margin-inline-start:-7.5em;color:var(--muted)}.stack td:empty{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.ex,.card,.quest,.stat,.cbox{border-color:color-mix(in srgb,var(--sys) 30%,var(--line))!important;box-shadow:0 0 16px var(--glow)}
.ex,.card,.quest,.stat{border-radius:12px}
.card h2,.blkhead h2{letter-spacing:.01em}
.done[aria-pressed=true],.checkbtn[aria-pressed=true]{background:var(--sys)!important;color:light-dark(#fff,#04121f)!important;box-shadow:0 0 12px var(--glow)}
.big{background:var(--sys);color:light-dark(#fff,#04121f);font-family:var(--disp);font-size:21px;letter-spacing:.04em;box-shadow:0 0 18px var(--glow)}
.bnav{background:var(--surface);border-top-color:color-mix(in srgb,var(--sys) 30%,var(--line))}
.bnav button[aria-selected=true]{color:var(--sys)}
.rank{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 6px;border-radius:8px;font-family:var(--disp);font-weight:700;font-size:20px;color:#04121f;background:var(--rc);box-shadow:0 0 12px color-mix(in srgb,var(--rc) 60%,transparent)}
.statwin{background:linear-gradient(180deg,var(--glow),transparent 60%),var(--surface);border:1px solid color-mix(in srgb,var(--sys) 55%,transparent);border-radius:12px;padding:16px;margin-top:14px;box-shadow:0 0 24px var(--glow)}
.statwin .top2{display:flex;gap:14px;align-items:center}
.statwin .rank{min-width:64px;height:64px;font-size:40px;border-radius:12px}
.statrow{display:grid;grid-template-columns:3.2em minmax(0,1fr) 2.6em;gap:10px;align-items:center;margin:8px 0;font-weight:600}
.statrow .k{font-family:var(--disp);font-size:18px;color:var(--sys)}
.statrow .v{text-align:right;font-family:var(--disp);font-size:20px;font-variant-numeric:tabular-nums}
.sbar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}.sbar i{display:block;height:100%;background:var(--sys);box-shadow:0 0 8px var(--sys)}
.penalty{border:1px solid #ef4444;background:light-dark(#fff5f5,#1f0b10);border-radius:12px;padding:14px;margin-top:14px;box-shadow:0 0 18px rgba(239,68,68,.18)}
.penalty .syslabel{color:#ef4444;border-color:#ef4444}
.sysnote{position:fixed;left:50%;top:22%;transform:translate(-50%,0) scale(.96);opacity:0;z-index:45;min-width:min(86vw,320px);text-align:center;background:light-dark(rgba(255,255,255,.96),rgba(6,12,26,.94));border:1px solid var(--sys);border-radius:12px;padding:18px 20px;box-shadow:0 0 40px var(--glow),0 0 0 1px var(--glow) inset;pointer-events:none;transition:opacity .25s,transform .25s}
.sysnote.on{opacity:1;transform:translate(-50%,0) scale(1)}
.sysnote b{display:block;font-family:var(--disp);font-size:34px;line-height:1.1;color:var(--sys);text-shadow:0 0 14px var(--glow)}
.sysnote small{color:var(--muted);font-size:14px}
.gate{display:flex;justify-content:space-between;align-items:center;gap:10px}
.av{display:inline-block;flex:none;line-height:0}.av svg{width:100%;height:100%;overflow:visible}
.av .spin{animation:avspin 14s linear infinite;transform-origin:60px 60px}.av .spinr{animation:avspin 9s linear infinite reverse;transform-origin:60px 60px}
.av .pulse{animation:avpulse 2.4s ease-in-out infinite;transform-origin:60px 60px}.av .tw{animation:avtw 1.8s ease-in-out infinite}
@keyframes avspin{to{transform:rotate(360deg)}}@keyframes avpulse{50%{opacity:.55;transform:scale(1.04)}}@keyframes avtw{50%{opacity:.15}}
.avbtn{border:0;background:none;padding:0;width:48px;height:48px;cursor:pointer;border-radius:50%}
.frames{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.frames button{border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:8px 4px;display:grid;justify-items:center;gap:2px;font-size:13px;font-weight:600;color:var(--ink);min-height:44px}
.frames button[aria-pressed=true]{border-color:var(--sys);box-shadow:0 0 12px var(--glow)}
.frames button:disabled{opacity:.45;cursor:not-allowed}
@media(prefers-reduced-motion:reduce){.av .spin,.av .spinr,.av .pulse,.av .tw{animation:none}}
/* app bar + bottom nav */
.iconbtn{width:44px;height:44px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--sunk);border-radius:12px;padding:4px;margin-top:8px}
.seg button{min-height:44px;border:0;border-radius:9px;background:none;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.appbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:58px}
.brand{display:grid;line-height:1.1}.brand b{font-family:var(--disp);font-size:18px;font-weight:700;white-space:nowrap;letter-spacing:.02em}.brand span{font-size:13px;color:var(--muted)}
.stats{display:flex;gap:8px;align-items:center}
.pill{display:flex;align-items:center;gap:6px;min-height:40px;padding:4px 12px 4px 8px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer}
.pill .num{font-family:var(--disp);font-size:22px;line-height:1}
.pill.flame svg{filter:drop-shadow(0 1px 2px rgba(234,88,12,.35))}
.pill.flame.dim svg{filter:grayscale(1);opacity:.55}
.bnav[hidden]{display:none!important}
.fo,.fi{transform-box:fill-box;transform-origin:50% 100%}
svg .fo{animation:flk1 1.15s ease-in-out infinite}svg .fi{animation:flk2 .8s ease-in-out infinite}
.dim svg .fo,.dim svg .fi{animation:none}
@keyframes flk1{0%,100%{transform:scale(1,1) skewX(0)}30%{transform:scale(.96,1.07) skewX(-3deg)}60%{transform:scale(1.03,.95) skewX(2deg)}}
@keyframes flk2{0%,100%{transform:scale(1,1)}40%{transform:scale(.9,1.14)}70%{transform:scale(1.06,.9)}}
.frz{display:inline-flex;align-items:center;gap:2px;font-weight:700;font-size:13px;color:#7dd3fc}
.frz svg{width:16px;height:16px}
.av .fl{transform-box:fill-box;transform-origin:50% 100%;animation:avfl 1s ease-in-out infinite}
@keyframes avfl{0%,100%{transform:scaleY(1) scaleX(1)}35%{transform:scaleY(1.22) scaleX(.9)}65%{transform:scaleY(.88) scaleX(1.06)}}
.av .breath{transform-origin:60px 64px;animation:avbr 5s ease-in-out infinite}@keyframes avbr{50%{transform:scale(1.035)}}
.av .blink{transform-box:fill-box;transform-origin:50% 50%;animation:avbl 4.6s infinite}@keyframes avbl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.av .aura{animation:avau 2.8s ease-in-out infinite}@keyframes avau{50%{opacity:.35}}
.av .sweep{animation:avsw 6s ease-in-out infinite}@keyframes avsw{0%,70%{transform:translateX(-90px)}100%{transform:translateX(90px)}}
.av .orb{animation:avspin 9s linear infinite;transform-origin:60px 60px}
.av .rot{animation:avspin linear infinite;transform-origin:60px 60px}
.av .flow{animation:avflow 1.6s linear infinite}@keyframes avflow{to{stroke-dashoffset:-24}}
.av .glow{animation:avglow 2.4s ease-in-out infinite}@keyframes avglow{0%,100%{opacity:.08}50%{opacity:.45}}
.av .breathe{animation:avbreathe 2.4s ease-in-out infinite;transform-origin:60px 60px}@keyframes avbreathe{50%{transform:scale(1.035)}}
.av .ember{animation:avember 2.2s ease-out infinite;transform-box:fill-box}@keyframes avember{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
@media(prefers-reduced-motion:reduce){svg .fo,svg .fi,.av .fl,.av .breath,.av .blink,.av .aura,.av .sweep,.av .orb,.av .rot,.av .flow,.av .glow,.av .breathe,.av .ember{animation:none!important}}
.pill.lv{gap:8px}.pill.lv small{font-size:12px;color:var(--muted);font-weight:600;display:block;line-height:1}
.pill.lv>span{display:grid}.mini{display:block;width:54px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:3px}.mini i{display:block;height:100%;background:var(--xp)}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom)}
.bnav button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:8px 4px 6px;min-height:58px;font-size:12px;font-weight:600;color:var(--muted)}
.bnav button svg{width:24px;height:24px}
.bnav button[aria-selected=true]{color:var(--ink)}
.bnav button[aria-selected=true] .ico{background:var(--sunk);border-radius:99px}
.bnav .ico{display:grid;place-items:center;width:52px;height:30px;transition:background .2s}
.timer{bottom:calc(58px + env(safe-area-inset-bottom))!important;visibility:hidden;transform:translateY(calc(100% + 70px))}.timer.on{visibility:visible;transform:none}
.timer .wrap{padding-bottom:10px!important}
/* session HUD */
.hud{position:sticky;top:58px;z-index:15;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.hudrow{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:600;gap:8px}
.hudrow b{font-family:var(--disp);font-size:20px}
.track{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;margin-top:6px}
.track i{display:block;height:100%;background:linear-gradient(90deg,var(--day,var(--xp)),color-mix(in srgb,var(--day,var(--xp)) 70%,#fff));border-radius:5px;transition:width .3s ease-out}
.xpchip{display:inline-flex;align-items:center;gap:4px;color:var(--xp);font-weight:700}
.quest{display:grid;grid-template-columns:92px minmax(0,1fr);gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:14px}
.ring{width:92px;height:92px;position:relative}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-size:26px}
.quest h2{font-size:24px}.quest p{margin:2px 0;font-size:15px;color:var(--muted)}
.cnt{font-variant-numeric:tabular-nums}
.cnt.full{color:var(--xp);font-weight:700}
/* feedback */
.xpfloat{position:absolute;right:4px;top:-6px;font-weight:800;color:var(--xp);pointer-events:none;animation:xpup .8s ease-out forwards;font-size:15px}
@keyframes xpup{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-28px)}}
.setrow{position:relative}
.toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-20px);opacity:0;z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;display:flex;gap:8px;align-items:center;transition:opacity .2s,transform .2s;max-width:92vw;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.celebrate{position:fixed;inset:0;z-index:50;background:rgba(10,12,16,.6);display:none;place-items:center;padding:16px}
.celebrate.on{display:grid}
.cbox{background:var(--surface);border-radius:22px;max-width:420px;width:100%;padding:24px 20px 18px;text-align:center;position:relative;overflow:hidden;animation:pop .3s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.cbox .bigflame{width:84px;height:84px;margin:0 auto;animation:flicker 1.6s ease-in-out infinite}
@keyframes flicker{50%{transform:scale(1.08) rotate(-2deg)}}
.cbox h2{font-size:36px;margin-top:6px}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:16px 0}
.cgrid div{background:var(--sunk);border-radius:12px;padding:10px}
.cgrid b{display:block;font-family:var(--disp);font-size:28px;line-height:1.1}
.cgrid span{font-size:13px;color:var(--muted)}
.newbadge{display:flex;gap:10px;align-items:center;text-align:left;background:var(--sunk);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.conf{position:absolute;top:-10px;width:8px;height:14px;border-radius:2px;animation:fall 1.8s ease-in forwards;opacity:.9}
@keyframes fall{to{transform:translateY(520px) rotate(540deg);opacity:0}}
/* progress tab */
.lvcard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat .big2{font-family:var(--disp);font-size:44px;font-weight:800;line-height:1;display:flex;align-items:center;gap:6px}
.stat .lbl{font-size:14px;color:var(--muted)}
.xpbar{height:12px;border-radius:6px;background:var(--sunk);overflow:hidden;margin:8px 0 4px}.xpbar i{display:block;height:100%;background:var(--xp)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-top:8px}
.badge{display:grid;justify-items:center;text-align:center;gap:4px;padding:10px 6px;border-radius:14px;background:var(--sunk);font-size:13px;line-height:1.25}
.badge b{font-size:14px}
.badge.locked{opacity:.45}.badge.locked svg{filter:grayscale(1)}
.wkdots{display:flex;gap:6px;margin-top:8px}.wkdots span{flex:1;height:10px;border-radius:5px;background:var(--sunk)}.wkdots span.on{background:var(--c)}
@media(prefers-reduced-motion:reduce){.xpfloat,.conf,.cbox,.cbox .bigflame{animation:none!important}.conf{display:none}}

/* ---------- render: guide ---------- */
function guide(){
 return `<div class="wrap">
 <div class="card"><h2>How to run every set</h2><ol>
 <li><b>Reps in reserve.</b> "2 in reserve" means stop when you could still do 2 more clean reps. Muscle growth improves as sets end closer to failure, but beginners misjudge it, so main lifts stay at 2 and isolation lifts at 1.</li>
 <li><b>Double progression.</b> Pick a weight that lets you reach the bottom of the rep range. When every set reaches the top of the range with clean form, add the smallest step next time (dumbbells +1–2.5 kg, machines one plate, barbell +2.5 kg) and build the reps back up. The app flags lifts that are ready.</li>
 <li><b>Tempo.</b> Lower for 2–3 seconds, no bouncing, full range of motion.</li>
 <li><b>Rest.</b> 2–2.5 min on big lifts, 60–90 s on small ones. Tap the tick after a set and the timer starts.</li>
 <li><b>If a set fails early</b>, finish your sets with 2.5 kg less rather than cutting range of motion.</li></ol></div>
 <div class="card"><h2>Programme phases</h2><ul><li><b>Build weeks:</b> full plan, add weight as you earn it. In your first week on this plan, use the first set of each new exercise to find a weight that leaves about 2–3 reps in reserve.</li><li><b>Deload every 9th week:</b> half the sets at about 90% of the weight. Then repeat: 8 build weeks, 1 deload.</li></ul>
 <label style="display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;margin:12px 0;font-size:15px"><input type="checkbox" id="rampt" ${st.ramp?'checked':''} style="width:24px;height:24px;margin-top:2px"><span><b>I'm brand new to the gym.</b> Add 2 easier weeks at the start (one set fewer, about 3 reps in reserve) while muscles get used to training. Leave this off if you have already been training for 3 weeks or more.</span></label>

 <div class="card"><h2>Cardio and belly fat</h2><ul>
 <li>Fat comes off the whole body through a calorie deficit; ab exercises do not target belly fat. Moderate or vigorous aerobic training has shown the strongest effect on deep (visceral) belly fat.</li>
 <li>Weekly target: about 150 minutes of moderate activity, matching WHO guidance. Here that is 3 short zone 2 sessions after lifting, a 30–40 min recovery session on Wednesday, plus daily steps.</li>

 <div class="card"><h2>Profile</h2><div class="field"><label for="hname">Shown on your status window</label><input id="hname" value="${esc(st.name||'')}" placeholder="Hunter" maxlength="24"></div>

 <p class="note" style="margin-top:12px">${avCount()?`${avCount()} of 6 hunter portraits on this phone. They are kept only here and in your private Drive backup.`:'No hunter portraits on this phone yet. Import your avatar pack once; Drive then copies it to your other devices.'}</p>

 {const w=weekInfo(iso(new Date()));document.getElementById('hdrdate').textContent=w.n>0?`Week ${w.n}, ${w.name.toLowerCase()} week`:'Workout tracker'}

/* ---------- rest timer ---------- */
let tEnd=0,tTotal=0,tInt=null,actx=null;
const tEl=document.getElementById('timer'),tNum=document.getElementById('tnum'),tLbl=document.getElementById('tlbl'),tBar=document.getElementById('tbar');
function beep(){try{if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.value=.25;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.35)}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function tick(){const left=Math.max(0,Math.round((tEnd-Date.now())/1000));tNum.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');tBar.style.width=(tTotal?left/tTotal*100:0)+'%';
 if(left<=0){clearInterval(tInt);tInt=null;tEl.classList.add('end');tLbl.textContent='Rest over. Next set.';beep();setTimeout(()=>{if(!tInt)tEl.classList.remove('on','end')},6000)}}
function startTimer(sec,label){if(!sec)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch(e){}tTotal=sec;tEnd=Date.now()+sec*1000;tLbl.textContent='Rest after '+label;tEl.classList.remove('end');tEl.classList.add('on');tEl.style.setProperty('--day',getComputedStyle(document.querySelector('.hero')||document.body).getPropertyValue('--day'));clearInterval(tInt);tInt=setInterval(tick,250);tick()}

   if(isPR)toast(`${FLAME}<span>New PR: ${esc(EX[ex].n)} ${esc(v.w)} kg × ${esc(v.r)}</span>`)}else updateHUD();return}
 if(a==='check'){const lg=logOf(ui.date);lg.checks[b.dataset.c]=!lg.checks[b.dataset.c];b.setAttribute('aria-pressed',!!lg.checks[b.dataset.c]);save(ui.date);updateHUD();if(lg.checks[b.dataset.c])xpFloat(b,'+2 XP');return}
 if(a==='mode'||a==='setmode'){const order=['auto','light','dark'];st.mode=a==='setmode'?b.dataset.m:order[(order.indexOf(st.mode||'auto')+1)%3];applyMode();save('meta');render();toast(`${MODES[st.mode].i}<span>Theme: ${MODES[st.mode].n}${st.mode==='auto'?' (follows your phone)':''}</span>`);return}
 if(a==='unlock'){Drive.signIn();return}
 if(a==='avdel'){AVS={};try{localStorage.removeItem(AVK)}catch(e){}render();toast('Avatars removed from this phone');return}
 if(a==='setav'){st.av=b.dataset.v;save('meta');render();return}
 if(a==='frame'){st.frame=b.dataset.f;save('meta');render();return}
 if(a==='photodel'){delete st.photo;if(st.av==='photo')st.av='m';save('meta');render();return}
 if(a==='celeclose'){document.getElementById('cele').classList.remove('on');return}
 if(a==='finish'){const before=game(),lg=logOf(ui.date);lg.done=!lg.done;lg.at=Date.now();save(ui.date);render();if(lg.done){scrollTo({top:0});celebrate(ui.date,before);Drive.auto(true)}return}
 if(a==='t+15'){tEnd+=15000;tTotal+=15;if(!tInt){tEl.classList.remove('end');tInt=setInterval(tick,250)}tick();return}
 if(a==='t-15'){tEnd-=15000;tick();return}
 if(a==='tskip'){clearInterval(tInt);tInt=null;tEl.classList.remove('on','end');return}
 if(a==='delbody'){st.body=st.body.filter(x=>x.d!==b.dataset.d);save('meta');render();return}
 if(a==='export'){const t=JSON.stringify(st);const io=document.getElementById('io');io.value=t;const m=document.getElementById('iomsg');
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>m.textContent='Copied. Paste it somewhere safe.',()=>{io.select();m.textContent='Select the text in the box and copy it.'});return}
 if(a==='import'){const m=document.getElementById('iomsg');try{const o=JSON.parse(document.getElementById('io').value);if(!mergeState(o))throw 0;save();render();Drive.auto();toast('Data merged')}catch(err){m.textContent='That text is not valid backup data. Copy the whole backup and try again.'}return}
 if(a==='gsync'){Drive.ok()?Drive.sync(true):Drive.signIn();return}
 if(a==='gout'){Drive.signOut();render();return}
 if(a==='fileout'){const f=new File([JSON.stringify(st)],'hunter-system-backup-'+iso(new Date())+'.json',{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Hunter System backup'}).catch(()=>{})}else{const u=URL.createObjectURL(f),l=document.createElement('a');l.href=u;l.download=f.name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}return}
});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.f){const lg=logOf(ui.date);lg.sets[t.dataset.ex]=lg.sets[t.dataset.ex]||[];const v=lg.sets[t.dataset.ex][+t.dataset.s]=lg.sets[t.dataset.ex][+t.dataset.s]||{};v[t.dataset.f]=t.value.replace(',','.').replace(/[^\d.]/g,'');t.value=v[t.dataset.f];save(ui.date);return}
 if(t.id==='swap'){const lg=logOf(ui.date);lg.day=t.value;save(ui.date);render();return}
 if(t.id==='startd'&&t.value){st.start=t.value;save('meta');return}
 if(t.id==='rampt'){st.ramp=t.checked;save('meta');return}
 if(t.id==='hname'){st.name=t.value.trim().slice(0,24);save('meta');render();return}
 if(t.id==='photoin'&&t.files[0]){const im=new Image(),u=URL.createObjectURL(t.files[0]);im.onload=()=>{const c=document.createElement('canvas'),z=160;c.width=c.height=z;const k=Math.max(z/im.width,z/im.height),w=im.width*k,h=im.height*k;c.getContext('2d').drawImage(im,(z-w)/2,(z-h)/2,w,h);st.photo=c.toDataURL('image/jpeg',.82);st.av='photo';URL.revokeObjectURL(u);save('meta');render();toast('Profile photo updated')};im.onerror=()=>toast('That image could not be read');im.src=u;return}
 if(t.id==='avpackin'&&t.files[0]){t.files[0].text().then(x=>{let o=null;try{o=JSON.parse(x)}catch(e){}
  const n=o&&o.type==='hunter-avatars'?setAvatars({...o,u:Date.now()}):0;n?(render(),toast(`Avatar pack imported (${n} portraits)`)):toast('That file is not a Hunter System avatar pack')});t.value='';return}
 if(t.id==='filein'&&t.files[0]){t.files[0].text().then(x=>{try{if(!mergeState(JSON.parse(x)))throw 0;save();render();Drive.auto();toast('Backup file merged')}catch(e){toast('That file is not a Hunter System backup')}});return}
});
document.addEventListener('submit',e=>{if(e.target.id!=='bodyf')return;e.preventDefault();const d=document.getElementById('bd').value,w=document.getElementById('bw').value.replace(',','.'),wa=document.getElementById('bwa').value.replace(',','.');
 if(!d||(!w&&!wa))return;st.body=st.body.filter(x=>x.d!==d);st.body.push({d,w:w.replace(/[^\d.]/g,''),wa:wa.replace(/[^\d.]/g,'')});save('meta');render()});
setInterval(()=>{const n=iso(new Date());if(ui.today!==n){const was=ui.today;ui.today=n;if(was&&ui.date===was){ui.date=n;if(ui.tab==='today')render()}}},60000);ui.today=iso(new Date());
applyMode();render();

/* ---------- PWA ---------- */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
Drive.boot();
}
</script>
</body>
